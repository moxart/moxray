[package]
name = "moxray"
version = "0.1.0"
edition = "2021"
description = "A v2rayN-style proxy client for Xray-core, built with Tauri"
license = "MIT"
repository = "https://github.com/moxart/moxray"
authors = ["Patrick Der Avakians"]

[lib]
name = "moxray_lib"
path = "src/lib.rs"

[[bin]]
name = "moxray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures = "0.3"
anyhow = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
lto = "thin"
strip = true
